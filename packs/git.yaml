# Bundled pack: git operations that rewrite or discard history and work.
rules:
  - id: git.force-push
    doc: Force push without lease.
    tool: shell
    match:
      command: '\bgit\b[^;&|]*\bpush\b[^;&|]*(?:--force(?!-with-lease)\b|\s-[A-Za-z]*f[A-Za-z]*\b|\s\+[\w./-]+)'
    action: ask
    override: true
    message: Force push rewrites remote history; prefer --force-with-lease.
    examples:
      block:
        - git push --force origin main
        - git push -f
        - git push origin +main
      pass:
        - git push --force-with-lease origin feature
        - git push origin main
        - 'git push -f origin feature # guard: allow user asked to replace the feature branch'

  - id: git.reset-hard
    doc: Discarding uncommitted work.
    tool: shell
    match:
      command: '\bgit\b[^;&|]*\breset\b[^;&|]*--hard\b'
    action: ask
    override: true
    message: git reset --hard discards uncommitted changes.
    examples:
      block:
        - git reset --hard HEAD~1
        - git -C repo reset --hard
      pass:
        - git reset --soft HEAD~1
        - git reset file.txt

  - id: git.clean-force
    doc: Deleting untracked files.
    tool: shell
    match:
      command: '\bgit\b[^;&|]*\bclean\b[^;&|]*\s-[A-Za-z]*f'
    action: ask
    override: true
    message: git clean -f deletes untracked files permanently.
    examples:
      block:
        - git clean -fdx
        - git clean -f
      pass:
        - git clean -n

  - id: git.checkout-discard
    doc: Discarding working-tree changes of all files.
    tool: shell
    match:
      command: '\bgit\b[^;&|]*\b(?:checkout|restore)\b[^;&|]*\s(?:--\s+)?\.(?=\s|$|;)'
    action: ask
    override: true
    message: Discards uncommitted changes in the working tree.
    examples:
      block:
        - git checkout -- .
        - git restore .
      pass:
        - git checkout main
        - git restore src/file.ts

  - id: git.no-verify
    doc: Skipping repository hooks.
    tool: shell
    match:
      command: '\bgit\b[^;&|]*\b(?:commit|push|merge|rebase|am)\b[^;&|]*--no-verify\b|\bgit\b[^;&|]*\bcommit\b[^;&|]*\s-[A-Za-z]*n[A-Za-z]*\b'
    action: block
    override: true
    message: Skipping git hooks with --no-verify is not allowed.
    examples:
      block:
        - git commit --no-verify -m "wip"
        - git push --no-verify
      pass:
        - git commit -m "Update readme"
        - 'git commit --no-verify -m "wip" # guard: allow user asked to bypass the broken hook'

  - id: git.branch-force-delete
    doc: Deleting a branch that may be unmerged.
    tool: shell
    match:
      command: '\bgit\b[^;&|]*\bbranch\b[^;&|]*\s(?:-D|--delete\s+--force|-d\s+-f)\b'
    action: warn
    message: -D deletes the branch even when it is not merged.
    examples:
      block:
        - git branch -D old-feature
      pass:
        - git branch -d merged-feature
