# Bundled pack: credentials in files, commands and tool output.
rules:
  - id: secrets.read-env-file
    doc: Reading a dotenv file, which usually holds credentials.
    tool: read
    match:
      path: '(?:^|/)\.env(?:\.[\w-]+)?$'
      not_path: '\.env\.(?:example|sample|template|dist)$'
    action: ask
    message: Reads a .env file that may contain credentials.
    examples:
      block:
        - .env
        - /srv/app/.env.production
      pass:
        - .env.example
        - src/env.ts

  - id: secrets.shell-read-env-file
    doc: Printing a dotenv or credential file from the shell.
    tool: shell
    match:
      command: '(?i)\b(?:cat|type|less|more|head|tail|bat|get-content|gc)\b[^;&|]*?(?:\.env(?!\.(?:example|sample|template|dist)\b)(?:\.[\w-]+)?\b|\bid_(?:rsa|ed25519|ecdsa)\b(?!\.pub)|\.aws[\\/]credentials\b|\.netrc\b)'
    action: ask
    override: true
    message: Prints a file that may contain credentials.
    examples:
      block:
        - cat .env
        - Get-Content .env.local
        - cat ~/.ssh/id_ed25519
        - cat ~/.aws/credentials
      pass:
        - cat .env.example
        - cat ~/.ssh/id_ed25519.pub
        - cat README.md

  - id: secrets.write-credential
    doc: Writing a literal credential into a file.
    tool: write
    match:
      content: &secret_patterns
        - 'AKIA[0-9A-Z]{16}'
        - 'gh[pousr]_[A-Za-z0-9]{36,}'
        - 'github_pat_[A-Za-z0-9_]{40,}'
        - 'sk-(?:ant-|proj-)?[A-Za-z0-9_-]{20,}'
        - 'xox[abprs]-[A-Za-z0-9-]{10,}'
        - 'AIza[0-9A-Za-z_-]{35}'
        - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    action: warn
    message: The written content contains what looks like a credential; keep secrets out of tracked files.
    examples:
      block:
        - { file_path: config.ts, content: 'const key = "sk-abcdefghijklmnopqrstuvwxyz123456"' }
      pass:
        - { file_path: config.ts, content: 'const key = process.env.API_KEY' }

  - id: secrets.write-credential-edit
    doc: Same as secrets.write-credential for the replacement text of an edit.
    tool: edit
    match:
      new: *secret_patterns
    action: warn
    message: The edit inserts what looks like a credential; keep secrets out of tracked files.
    examples:
      block:
        - { file_path: a.py, old_string: 'KEY = ""', new_string: 'KEY = "AKIAABCDEFGHIJKLMNOP"' }
      pass:
        - { file_path: a.py, old_string: 'KEY = ""', new_string: 'KEY = os.environ["KEY"]' }

  - id: secrets.redact-output
    doc: Mask credentials that appear in any tool output before the model sees them.
    when: post_tool
    tool: any
    match:
      output:
        - 'AKIA[0-9A-Z]{16}'
        - 'gh[pousr]_[A-Za-z0-9]{36,}'
        - 'github_pat_[A-Za-z0-9_]{40,}'
        - 'sk-(?:ant-|proj-)?[A-Za-z0-9_-]{20,}'
        - 'xox[abprs]-[A-Za-z0-9-]{10,}'
        - 'AIza[0-9A-Za-z_-]{35}'
        - '-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----'
    action: redact
    message: Credential masked in tool output.
    examples:
      block:
        - 'DEEPSEEK_API_KEY=sk-0123456789abcdef0123456789abcdef'
        - 'token ghp_0123456789abcdefghijklmnopqrstuvwxyzAB'
      pass:
        - 'build finished in 3.2 s'
        - 'sk-short'
