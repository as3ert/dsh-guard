# Profile overlay for trying dsh-guard in `dsh headless` with the DeepSeek
# account you signed in to in the desktop app. The headless template disables
# the account rows; this overlay turns them back on and selects the account's
# model. Not needed when DEEPSEEK_API_KEY is set in the environment.
#
#   dsh <profile> --patch examples/headless-account.yml "your prompt"
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-v4-pro
- id: session-title-llm
  disabled: true
