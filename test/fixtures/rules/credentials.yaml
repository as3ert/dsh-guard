# Synthetic fixture rules for content, edit and output matching. The pattern
# FIXTURE-SECRET-... is an invented token shape, not a real credential format.
rules:
  - id: fixture.warn-write-secret
    doc: Warning when written content holds a fixture token.
    tool: write
    match:
      content: &fixture_token
        - 'FIXTURE-SECRET-[A-Z0-9]{12,}'
    action: warn
    message: Fixture content warn.
    examples:
      block:
        - { file_path: a.txt, content: 'key = FIXTURE-SECRET-0123456789AB' }
      pass:
        - { file_path: a.txt, content: 'key = from-env' }

  - id: fixture.warn-edit-secret
    doc: Same as fixture.warn-write-secret for the replacement text of an edit.
    tool: edit
    match:
      new: *fixture_token
    action: warn
    message: Fixture edit warn.
    examples:
      block:
        - { file_path: a.txt, old_string: 'key = ""', new_string: 'key = "FIXTURE-SECRET-0123456789AB"' }
      pass:
        - { file_path: a.txt, old_string: 'key = ""', new_string: 'key = "from-env"' }

  - id: fixture.redact-output
    doc: Mask a fixture token in any tool output.
    when: post_tool
    tool: any
    match:
      output:
        - 'FIXTURE-SECRET-[A-Z0-9]{12,}'
    action: redact
    message: Fixture token masked.
    examples:
      block:
        - 'API_KEY=FIXTURE-SECRET-0123456789ABCDEF'
      pass:
        - 'build finished'
        - 'FIXTURE-SECRET-SHORT'
